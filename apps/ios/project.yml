# 云食册 iOS App 的工程定义，用 XcodeGen 生成 Cook.xcodeproj（不提交生成的工程）：
#   pnpm convert && xcodegen generate --spec apps/ios/project.yml
name: Cook
options:
  bundleIdPrefix: fun.yunle
  deploymentTarget:
    iOS: '17.0'
  developmentLanguage: zh-Hans
  createIntermediateGroups: true
packages:
  CookCore:
    path: CookCore
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: 2.0.0
    CURRENT_PROJECT_VERSION: '7'
    DEVELOPMENT_TEAM: ${APPLE_DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic
targets:
  Cook:
    type: application
    platform: iOS
    sources:
      - path: Cook
        excludes: [Resources/AppIcon.icon, Resources/AppIcon.icon/**]
      # Icon Composer 分层图标（iOS 26+），作为单个文件加入；Assets.xcassets 里同名的 AppIcon.appiconset 给旧系统兜底
      - path: Cook/Resources/AppIcon.icon
        type: file
        buildPhase: resources
      - path: ../../docs/privacy.md
        type: file
        buildPhase: resources
      - path: ../../packages/shared/Assets.xcassets
        type: file
        buildPhase: resources
      - path: ../../packages/shared/links.json
        type: file
        buildPhase: resources
    dependencies:
      - package: CookCore
    preBuildScripts:
      - name: 拷贝共享数据
        script: bash "$SRCROOT/scripts/copy-data.sh"
        basedOnDependencyAnalysis: false
    info:
      path: Cook/Info.plist
      properties:
        CFBundleDisplayName: 云食册
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        # cook-feedback 云函数的 HTTP 访问地址（docs/dev/data.md），生成工程前 export COOK_FEEDBACK_URL=…；不填时保留支持中心和邮件草稿入口，不发筛选信号
        CookFeedbackURL: ${COOK_FEEDBACK_URL}
        # 预留给原生微信入口；只在 SDK、账号绑定与审核均就绪后开启。
        CookWeChatLoginEnabled: $(COOK_WECHAT_LOGIN_ENABLED)
        LSApplicationQueriesSchemes: [bilibili]
        # 大图里的分享按钮可以把配图存到相册
        NSPhotoLibraryAddUsageDescription: 把菜谱配图存到相册。
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UIBackgroundModes: [remote-notification]
        # 启动屏用和做菜页一样的分组背景色（浅色 #F2F2F7、深色黑色），避免先白屏再变灰
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: Cook/Cook.entitlements
      properties:
        aps-environment: development
        # 系统账号授权使用 webcredentials；微信 Universal Links 使用独立的 /auth/wechat/ 路径。
        com.apple.developer.associated-domains:
          - webcredentials:cook.yunyoujun.cn
          - applinks:cook.yunyoujun.cn
        com.apple.developer.icloud-container-identifiers: [iCloud.fun.yunle.cook]
        com.apple.developer.icloud-services: [CloudKit]
    settings:
      base:
        PRODUCT_NAME: Cook
        PRODUCT_BUNDLE_IDENTIFIER: fun.yunle.cook
        COOK_WECHAT_LOGIN_ENABLED: NO
        TARGETED_DEVICE_FAMILY: '1,2'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # 构建脚本要读仓库里的 packages/data
        ENABLE_USER_SCRIPT_SANDBOXING: false
  CookTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CookTests
    dependencies:
      - target: Cook
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: fun.yunle.cook.tests
  CookUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: CookUITests
    dependencies:
      - target: Cook
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: fun.yunle.cook.uitests
        TEST_TARGET_NAME: Cook
schemes:
  Cook:
    build:
      targets:
        Cook: all
        CookTests: [test]
        CookUITests: [test]
    test:
      targets: [CookTests, CookUITests]
