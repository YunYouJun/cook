# 云食册 iOS App 的工程定义，用 XcodeGen 生成 Cook.xcodeproj（不提交生成的工程）：
#   pnpm convert && xcodegen generate --spec apps/ios/project.yml
name: Cook
options:
  bundleIdPrefix: cn.yunyoujun
  deploymentTarget:
    iOS: '17.0'
  developmentLanguage: zh-Hans
  createIntermediateGroups: true
packages:
  CookCore:
    path: CookCore
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: 2.0.0
    CURRENT_PROJECT_VERSION: '1'
    DEVELOPMENT_TEAM: ${APPLE_DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic
targets:
  Cook:
    type: application
    platform: iOS
    sources:
      - path: Cook
    dependencies:
      - package: CookCore
    preBuildScripts:
      - name: 拷贝共享数据
        script: bash "$SRCROOT/scripts/copy-data.sh"
        basedOnDependencyAnalysis: false
    info:
      path: Cook/Info.plist
      properties:
        CFBundleDisplayName: 云食册
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSApplicationQueriesSchemes: [bilibili]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UIBackgroundModes: [remote-notification]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: Cook/Cook.entitlements
      properties:
        aps-environment: development
        com.apple.developer.icloud-container-identifiers: [iCloud.cn.yunyoujun.cook]
        com.apple.developer.icloud-services: [CloudKit]
    settings:
      base:
        PRODUCT_NAME: Cook
        PRODUCT_BUNDLE_IDENTIFIER: cn.yunyoujun.cook
        TARGETED_DEVICE_FAMILY: '1,2'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # 构建脚本要读仓库里的 packages/data
        ENABLE_USER_SCRIPT_SANDBOXING: false
  CookTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CookTests
    dependencies:
      - target: Cook
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: cn.yunyoujun.cook.tests
schemes:
  Cook:
    build:
      targets:
        Cook: all
        CookTests: [test]
    test:
      targets: [CookTests]
