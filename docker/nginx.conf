server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Keep redirects relative when TLS or the public port belongs to a proxy.
    absolute_redirect off;

    # A stale asset URL must return 404, never the SPA entry point.
    location /_nuxt/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
