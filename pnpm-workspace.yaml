strictPeerDependencies: false
autoInstallPeers: false
ignoreWorkspaceRootCheck: true
strictDepBuilds: true
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  # First-party release reviewed and matched to the published tarball before rollout.
  - '@yunlefun/sso@0.7.0'
shamefullyHoist: true
shellEmulator: true
blockExoticSubdeps: true

trustPolicy: no-downgrade
trustPolicyExclude:
  # Babel still pins this established pre-provenance release.
  - semver@6.3.1
  # Google Workbox 7.4.1 pins this exact pre-release build helper.
  - '@trickfilm400/rollup-plugin-off-main-thread@3.0.0-pre1'

packages:
  - apps/*
  - docs
  - packages/*

overrides:
  # @nuxtjs/ionic's Web integration does not use native build tooling.
  # Keep Ionic UI/router while excluding the retired Capacitor shell and CLIs.
  '@nuxtjs/ionic@1.0.2>@capacitor/cli': '-'
  '@nuxtjs/ionic@1.0.2>@capacitor/core': '-'
  '@nuxtjs/ionic@1.0.2>@ionic/cli': '-'

peerDependencyRules:
  # UnoCSS exposes an optional Webpack adapter; this project builds with Vite.
  ignoreMissing:
    - webpack

allowBuilds:
  '@parcel/watcher': true
  core-js-pure: false
  esbuild: true
  protobufjs: false
  simple-git-hooks: true
  unrs-resolver: true
  vue-demi: true
