ignoreWorkspaceRootCheck: true
blockExoticSubdeps: true
minimumReleaseAge: 1440
minimumReleaseAgeExcludePrune: true

trustPolicy: no-downgrade
trustPolicyExclude:
  # Babel still pins this established pre-provenance release.
  - semver@6.3.1

autoInstallPeers: false

peerDependencyRules:
  # UnoCSS exposes an optional Webpack adapter; this project builds with Vite.
  ignoreMissing:
    - webpack

strictPeerDependencies: false
shamefullyHoist: true
shellEmulator: true
strictDepBuilds: true

packages:
  - apps/*
  - docs
  - packages/*

overrides:
  # @nuxtjs/ionic's Web integration does not use native build tooling.
  # Keep Ionic UI/router while excluding the retired Capacitor shell and CLIs.
  '@nuxtjs/ionic@1.0.2>@capacitor/cli': '-'
  '@nuxtjs/ionic@1.0.2>@capacitor/core': '-'
  '@nuxtjs/ionic@1.0.2>@ionic/cli': '-'
  '@nuxtjs/ionic@1.0.2>@ionic/vue': ^8.8.20
  '@nuxtjs/ionic@1.0.2>@ionic/vue-router': ^8.8.20
  # Security fixes beyond upstream ranges/pins; keep older unaffected branches.
  brace-expansion@>=4.0.0 <5.0.12: 5.0.12
  glob@>=9.0.0 <14.0.2: 14.0.2
  micromark-extension-math@3.1.0>katex: 0.18.2
  minimatch@>=7.0.0 <11.0.1: 11.0.5
  oxfmt@0.35.0>tinypool: 2.1.2

  unplugin: ^3.7.0
  vite: ^8.3.8

patchedDependencies:
  deepmerge@4.3.1: patches/deepmerge@4.3.1.patch

allowBuilds:
  '@parcel/watcher': true
  core-js-pure: false
  esbuild: true
  protobufjs: false
  simple-git-hooks: true
  unrs-resolver: true
  vue-demi: true
