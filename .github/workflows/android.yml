name: Android

on:
  push:
    branches: [main, dev]
    paths: &android_paths
      - 'apps/android/**'
      - docs/privacy-android.md
      - docs/terms.md
      - apps/ios/Cook/Resources/showcase-packs.json
      - 'apps/ios/Cook/Resources/cooking-badge-*.webp'
      - apps/ios/Cook/Resources/CloudKitchenManifest.json
      - apps/ios/Cook/Resources/CloudKitchen.usdz
      - 'assets/android/**'
      - 'assets/showcase/**/image.webp'
      - 'assets/showcase/**/model.glb'
      - 'packages/cook/**'
      - 'packages/data/**'
      - 'packages/shared/**'
      - 'cloudfunctions/cook-feedback/**'
      - '.github/actions/setup-js/**'
      - .github/workflows/android.yml
      - scripts/qa/verify-android-elf-alignment.py
      - scripts/export-android-scenes.py
      - .nvmrc
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
  pull_request:
    branches: [main, dev]
    paths: *android_paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-js
      - run: pnpm run convert
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/wrapper-validation@v6.4.1
      - uses: gradle/actions/setup-gradle@v6.4.1
        with:
          cache-provider: basic
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-37.2 build-tools;37.0.0
      - name: Set up Blender for the shared kitchen scene
        run: |
          version=4.4.0
          archive="blender-${version}-linux-x64.tar.xz"
          base="https://download.blender.org/release/Blender4.4"
          blender_dir="$(mktemp -d "$RUNNER_TEMP/cook-blender.XXXXXXXX")"
          cd "$blender_dir"
          trap 'rm -f "$archive"' EXIT
          curl --fail --location --retry 3 --output "$archive" "$base/$archive"
          echo "b4a74463677618d09621332ddbd62baa1a3ed06a11818714f6c5f1c7f31a15c6  $archive" | sha256sum --check
          tar -xf "$archive"
          echo "COOK_BLENDER=$blender_dir/blender-${version}-linux-x64/blender" >> "$GITHUB_ENV"
      - name: Run tests and verify APK and App Bundle builds
        working-directory: apps/android
        run: |
          ./gradlew :core:test :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease :app:bundleRelease --no-daemon
          ./gradlew :core:test :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease :app:bundleRelease --offline --no-daemon
          test -s app/build/outputs/bundle/release/app-release.aab
          "$ANDROID_HOME/build-tools/37.0.0/zipalign" -c -P 16 4 app/build/outputs/apk/release/app-release-unsigned.apk
          python3 ../../scripts/qa/verify-android-elf-alignment.py \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            app/build/outputs/bundle/release/app-release.aab
      - name: Verify opt-in WeChat callback
        working-directory: apps/android
        run: |
          aapt2="$ANDROID_HOME/build-tools/37.0.0/aapt2"
          apk=app/build/outputs/apk/debug/app-debug.apk
          default_manifest=$("$aapt2" dump xmltree --file AndroidManifest.xml "$apk")
          [[ "$default_manifest" != *".wxapi.WXEntryActivity"* ]]
          [[ "$default_manifest" != *'"com.tencent.mm"'* ]]
          ./gradlew :app:assembleDebug -Pcook.wechat.login=true -Pcook.wechat.signup=true --no-daemon
          enabled_manifest=$("$aapt2" dump xmltree --file AndroidManifest.xml "$apk")
          [[ "$enabled_manifest" == *"fun.yunle.cook.debug.wxapi.WXEntryActivity"* ]]
          [[ "$enabled_manifest" == *'"com.tencent.mm"'* ]]
