name: Support delivery synchronization

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      apply:
        description: Apply versioned Support commands (otherwise preview only)
        type: boolean
        default: false
      send_replies:
        description: Publish only explicitly authorized private binding replies
        type: boolean
        default: false
      allow_initialize:
        description: First use only; initialize only if no ledger history exists
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: cook-support-delivery-main
  cancel-in-progress: false

jobs:
  synchronize:
    if: github.repository == 'YunYouJun/cook' && github.ref == 'refs/heads/main' && (vars.COOK_SUPPORT_ENABLED == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Configure this environment to allow main only before installing its three private secrets.
    environment: support-cook
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install pinned browser verifier outside the checkout
        run: |
          npm install --prefix "$RUNNER_TEMP/cook-release-browser" --ignore-scripts --no-audit --no-fund playwright@1.62.1
          "$RUNNER_TEMP/cook-release-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Associate changes and reconcile verified production delivery
        env:
          GH_TOKEN: ${{ github.token }}
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
          COOK_SUPPORT_AGENT_JSON: ${{ secrets.COOK_SUPPORT_AGENT_JSON }}
          COOK_SUPPORT_BINDINGS_JSON: ${{ secrets.COOK_SUPPORT_BINDINGS_JSON }}
          COOK_SUPPORT_LEDGER_KEY: ${{ secrets.COOK_SUPPORT_LEDGER_KEY }}
          APPLY: ${{ github.event_name != 'workflow_dispatch' || inputs.apply }}
          SEND_REPLIES: ${{ github.event_name == 'workflow_dispatch' && inputs.send_replies }}
          ALLOW_INITIALIZE: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_initialize }}
        run: |
          export COOK_SUPPORT_STATE_DIR="$RUNNER_TEMP/cook-support-state"
          export COOK_PLAYWRIGHT_MODULE="$RUNNER_TEMP/cook-release-browser/node_modules/playwright/index.mjs"
          flags=()
          if [ "$APPLY" = true ]; then flags+=(--apply); fi
          if [ "$SEND_REPLIES" = true ]; then flags+=(--send-replies); fi
          if [ "$ALLOW_INITIALIZE" = true ]; then flags+=(--allow-initialize); fi
          node scripts/cook-support-sync.mjs "${flags[@]}"
      - name: Preserve only authenticated encrypted retry state
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cook-support-ledger
          path: ${{ runner.temp }}/cook-support-state/ledger.enc
          if-no-files-found: ignore
          retention-days: 90
