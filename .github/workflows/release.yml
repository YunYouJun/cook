name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      # after pnpm
      - name: Use Node.js LTS
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org/
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release version
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          import { readFileSync } from 'node:fs'
          const version = JSON.parse(readFileSync('package.json')).version
          assert.match(version, /^\d+\.\d+\.\d+(?:-[\w.-]+)?$/)
          assert.equal(process.env.GITHUB_REF_NAME, `v${version}`)
          assert.equal(JSON.parse(readFileSync('apps/web/package.json')).version, version)
          JS

      - name: Build
        run: pnpm build

      - name: Package web assets
        run: |
          mkdir release-assets
          tar -czf "release-assets/cook-web-${GITHUB_REF_NAME}.tar.gz" -C dist .
          cd release-assets
          sha256sum "cook-web-${GITHUB_REF_NAME}.tar.gz" > "cook-web-${GITHUB_REF_NAME}.tar.gz.sha256"

      - name: Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release-assets/*
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}

      - uses: actions/upload-artifact@v7
        with:
          name: Cook Dist
          path: release-assets/*
          if-no-files-found: error

      - run: npx changelogithub # or changelogithub@0.12 if ensure the stable result
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

  deploy-web:
    if: github.repository == 'YunYouJun/cook' && !contains(github.ref_name, '-')
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    concurrency:
      group: cook-web-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Publish the tagged commit to the EdgeOne production branch
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor HEAD FETCH_HEAD; then
            echo '::error::The release tag must reference a commit on main.'
            exit 1
          fi
          git push origin HEAD:refs/heads/web-production

      - name: Verify the live Web release
        run: |
          commit=$(git rev-parse HEAD)
          version=${GITHUB_REF_NAME#v}
          for attempt in {1..60}; do
            if curl -fsS --max-time 5 -H 'Cache-Control: no-cache' \
              "https://cook.yunyoujun.cn/.well-known/cook-build.json?release=${commit}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}" \
              | jq -e --arg commit "$commit" --arg version "$version" \
                '.productId == "cook" and .repository == "YunYouJun/cook" and .commitSha == $commit and .version == $version' >/dev/null; then
              echo "cook.yunyoujun.cn is serving ${GITHUB_REF_NAME} (${commit})."
              exit 0
            fi
            sleep 10
          done
          echo '::error::EdgeOne did not serve the tagged build in time. Check the web-production deployment in EdgeOne.'
          exit 1
