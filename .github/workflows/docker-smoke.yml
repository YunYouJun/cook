name: Docker deployment

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - compose.yaml
      - docker/**
      - scripts/test-docker.mjs
      - scripts/lib/web-build.mjs
      - .github/workflows/docker-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: docker/setup-buildx-action@v4
      - name: Validate Compose defaults and build from a clean checkout
        run: |
          docker compose config --quiet
          docker compose -p cook-smoke build
      - name: Verify direct and reverse-proxied HTTP routes
        env:
          COOK_EXPECTED_COMMIT: ${{ github.sha }}
        run: node scripts/test-docker.mjs cook-smoke-cook
      - name: Remove smoke resources
        if: always()
        run: docker compose -p cook-smoke down --rmi local
