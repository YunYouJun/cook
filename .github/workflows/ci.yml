name: CI

on:
  push:
    branches:
      - main
      - dev

  pull_request:
    branches:
      - main
      - dev

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Convert CSV to JSON
        run: pnpm run convert

      - name: Typecheck
        run: pnpm run typecheck

  test:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        node-version: [24]
        os: [ubuntu-latest]
      fail-fast: false

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: https://registry.npmjs.org/
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run convert
      - run: pnpm run validate
      - name: Check recipe ids against base branch
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 origin ${{ github.base_ref }}
          pnpm run validate --base FETCH_HEAD
      - run: pnpm run test

  # iOS 的 CookCore 跑和 Web 共用的用例（ubuntu 镜像自带 Swift）
  swift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - name: Set node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run convert
      - run: swift --version
      - run: swift test --package-path apps/ios/CookCore

  # 云食册 iOS App：XcodeGen 生成工程，在 iPhone 和 iPad 模拟器上编译并跑测试（窄屏和宽屏两种布局）
  ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - name: Set node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run convert
      - run: brew install xcodegen
      - run: xcodegen generate --spec apps/ios/project.yml
      - run: xcodebuild -version
      - name: Build and test
        run: |
          pick() {
            xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          print(next(d["udid"] for runtime in sorted(devices, reverse=True) if "iOS" in runtime for d in devices[runtime] if d["name"].startswith(sys.argv[1])))
          ' "$1"
          }
          IPHONE=$(pick iPhone)
          IPAD=$(pick iPad)
          # 先把两台模拟器开好机，开机时间不算进 UI 测试的等待
          xcrun simctl bootstatus "$IPHONE" -b
          xcrun simctl bootstatus "$IPAD" -b
          # 两台模拟器同时跑时机器很吃紧，UI 测试会从 1 分钟拖到十几分钟、偶发超时，所以一台跑完再跑另一台
          xcodebuild test -project apps/ios/Cook.xcodeproj -scheme Cook -destination "id=$IPHONE" -destination "id=$IPAD" \
            -disable-concurrent-destination-testing -resultBundlePath "$RUNNER_TEMP/xcresult/Cook.xcresult" CODE_SIGNING_ALLOWED=NO
      # 跑多个设备时 xcodebuild 的日志里只有失败的用例名，没有原因，从结果包里读出来
      - name: Show test failures
        if: failure()
        run: |
          [ -d "$RUNNER_TEMP/xcresult/Cook.xcresult" ] || exit 0
          xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/xcresult/Cook.xcresult" | python3 -c '
          import json, sys
          for failure in json.load(sys.stdin).get("testFailures", []):
              name = failure.get("testName", "")
              text = failure.get("failureText", "")
              print(f"::error title={name}::{text}")
              print(json.dumps(failure, ensure_ascii=False, indent=2))
          '
      # 截图和每一步的操作记录都在结果包里，下载后用 Xcode 打开
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-xcresult
          path: ${{ runner.temp }}/xcresult/
          if-no-files-found: ignore
          retention-days: 7
