name: CI

on:
  push:
    branches:
      - main
      - dev

  pull_request:
    branches:
      - main
      - dev

  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      docs_only: ${{ steps.changes.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Test change detection
        run: node --test test/ciChanges.test.mjs
      - name: Test isolated iOS infrastructure recovery
        run: node --test test/iosTestInfrastructure.test.mjs
      - name: Detect documentation-only changes
        id: changes
        run: node scripts/ci-changes.mjs

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Convert CSV to JSON
        run: pnpm run convert

      - name: Typecheck
        run: pnpm run typecheck

  # Build from a fresh checkout before typecheck can generate packages/cook/dist.
  # This matches the preview providers and catches missing workspace source aliases.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Build documentation
        run: pnpm run docs:build
      - name: Verify product site composition and legacy redirect
        run: |
          node --test test/docsRedirect.test.mjs test/productSiteBuild.test.mjs
          node scripts/compose-product-site.mjs

  test:
    permissions:
      contents: read
      actions: read
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
      fail-fast: false

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - name: Use repository Node.js version
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org/
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run convert
      - name: Verify managed AI service and shared intent contract
        run: |
          node scripts/generate-ai-intent-contract.mjs --check
          node --test test/cookAiIntent.test.mjs test/aiIntentContract.test.mjs
      - run: pnpm run validate
      - run: pnpm run amounts:check
      - name: Check recipe ids against base branch
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 origin ${{ github.base_ref }}
          pnpm run validate --base FETCH_HEAD
      - name: Test release provenance and Support delivery gates
        run: node --test --test-reporter=dot test/webBuildInfo.test.mjs test/productSiteBuild.test.mjs test/supportAgentHttp.test.mjs test/cookGithubChanges.test.mjs test/cookDeliverySync.test.mjs test/supportLedger.test.mjs test/supportArtifacts.test.mjs test/edgeoneRelease.test.mjs test/cookSupportRunner.test.mjs
      - run: pnpm run test
      - name: Install pinned artifact SDK for runtime contract verification
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: npm install --prefix "$RUNNER_TEMP/cook-artifact-contract" --ignore-scripts --no-audit --no-fund @actions/artifact@6.3.1
      - name: Verify finalized checkpoints with the real Actions artifact runtime
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v9
        env:
          GH_TOKEN: ${{ github.token }}
          COOK_ARTIFACT_MODULE: ${{ runner.temp }}/cook-artifact-contract/node_modules/@actions/artifact/lib/artifact.js
        with:
          script: |
            const { spawnSync } = require('node:child_process')
            const result = spawnSync(process.execPath, ['scripts/test-support-artifact-runtime.mjs'], { stdio: 'inherit' })
            if (result.error || result.status !== 0) core.setFailed('The artifact runtime contract failed.')

  web-acceptance:
    needs: [lint, typecheck, build, test]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require all Web jobs and every matrix entry to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: node -e 'if (Object.values(JSON.parse(process.env.RESULTS)).some(job => job.result !== "success")) process.exit(1)'

  # Run shared CookCore fixtures on Linux with an explicitly installed toolchain.
  swift:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - name: Set node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run convert
      - name: Install Swift
        uses: swift-actions/setup-swift@v2.4.0
        with:
          swift-version: 6.2.1
      - run: swift --version
      - run: swift test --package-path apps/ios/CookCore
      - run: bash scripts/test-private-recipe-roundtrip.sh
      - run: bash scripts/test-personal-catalog-roundtrip.sh
        env:
          COOK_SWIFT_SCRATCH_PATH: apps/ios/CookCore/.build

  # 云食册 iOS App：XcodeGen 生成工程，在 iPhone 和 iPad 模拟器上编译并跑测试（窄屏和宽屏两种布局）
  ios-tests:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true') }}
    runs-on: xcode-27
    timeout-minutes: 90
    strategy:
      fail-fast: false
      # Leave capacity for the two PR jobs while a full branch matrix runs.
      max-parallel: ${{ github.event_name == 'pull_request' && 2 || 3 }}
      matrix:
        device: [iphone, ipad]
        # PRs keep two focused device jobs; pushes and manual runs retain full coverage.
        suite: ${{ fromJSON(github.event_name == 'pull_request' && '["pr-regression"]' || '["regression-main", "regression-discovery", "dietary"]') }}
    env:
      # Match native UI validation with a pinned compiler and XCTest toolchain.
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - name: Set node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run convert
      - run: brew install xcodegen
      - run: xcodegen generate --spec apps/ios/project.yml
      - run: xcodebuild -version
      - name: Select compatible simulators
        id: simulators
        run: pnpm exec tsx scripts/select-ios-test-devices.ts >> "$GITHUB_OUTPUT"
      - name: Build for testing
        timeout-minutes: 15
        run: |
          xcodebuild build-for-testing -project apps/ios/Cook.xcodeproj -scheme Cook \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/cook-derived-data" CODE_SIGNING_ALLOWED=NO
      - name: Build and test
        timeout-minutes: ${{ github.event_name == 'pull_request' && 35 || 60 }}
        id: ios_tests
        env:
          DEVICE: ${{ steps.simulators.outputs[matrix.device] }}
          IOS_SUITE: ${{ matrix.suite }}
        run: bash scripts/run-ios-ci-tests.sh
      # 跑多个设备时 xcodebuild 的日志里只有失败的用例名，没有原因，从结果包里读出来
      - name: Show test failures
        timeout-minutes: 5
        if: ${{ failure() || cancelled() }}
        run: |
          for bundle in "$RUNNER_TEMP"/xcresult/*.xcresult; do
            [ -d "$bundle" ] || continue
            xcrun xcresulttool get test-results summary --path "$bundle" | python3 -c '
          import json, sys
          for failure in json.load(sys.stdin).get("testFailures", []):
              name = failure.get("testName", "")
              text = failure.get("failureText", "")
              print(f"::error title={name}::{text}")
              print(json.dumps(failure, ensure_ascii=False, indent=2))
          '
          done
      # 截图和每一步的操作记录都在结果包里，下载后用 Xcode 打开
      - name: Upload test results
        if: ${{ failure() || cancelled() || steps.ios_tests.outputs.infrastructure_retries == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: ios-xcresult-${{ matrix.device }}-${{ matrix.suite }}
          path: ${{ runner.temp }}/xcresult/
          if-no-files-found: ignore
          retention-days: 7

  # Preserve the stable required-check name while requiring every native matrix cell.
  ios:
    needs: [changes, ios-tests]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require every iOS group or verified documentation-only changes
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          IOS_RESULT: ${{ needs.ios-tests.result }}
        run: |
          if [[ "$CHANGES_RESULT" == success && "$DOCS_ONLY" == true && "$IOS_RESULT" == skipped ]]; then
            exit 0
          fi
          [[ "$IOS_RESULT" == success ]]
