name: CI

on:
  push:
    branches:
      - main
      - dev

  pull_request:
    branches:
      - main
      - dev

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      docs_only: ${{ steps.changes.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Test change detection
        run: node --test test/ciChanges.test.mjs
      - name: Test isolated iOS infrastructure recovery
        run: node --test test/iosTestInfrastructure.test.mjs
      - name: Detect documentation-only changes
        id: changes
        run: node scripts/ci-changes.mjs

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Convert CSV to JSON
        run: pnpm run convert

      - name: Typecheck
        run: pnpm run typecheck

  # Build from a fresh checkout before typecheck can generate packages/cook/dist.
  # This matches the preview providers and catches missing workspace source aliases.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Build documentation
        run: pnpm run docs:build
      - name: Verify product site composition and legacy redirect
        run: |
          node --test test/docsRedirect.test.mjs test/productSiteBuild.test.mjs
          node scripts/compose-product-site.mjs

  test:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        node-version: [24]
        os: [ubuntu-latest]
      fail-fast: false

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: https://registry.npmjs.org/
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run convert
      - run: pnpm run validate
      - run: pnpm run amounts:check
      - name: Check recipe ids against base branch
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 origin ${{ github.base_ref }}
          pnpm run validate --base FETCH_HEAD
      - run: pnpm run test

  # iOS 的 CookCore 跑和 Web 共用的用例（ubuntu 镜像自带 Swift）
  swift:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - name: Set node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run convert
      - run: swift --version
      - run: swift test --package-path apps/ios/CookCore
      - run: bash scripts/test-private-recipe-roundtrip.sh
      - run: bash scripts/test-personal-catalog-roundtrip.sh
        env:
          COOK_SWIFT_SCRATCH_PATH: apps/ios/CookCore/.build

  # 云食册 iOS App：XcodeGen 生成工程，在 iPhone 和 iPad 模拟器上编译并跑测试（窄屏和宽屏两种布局）
  ios:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true') }}
    runs-on: xcode-27
    env:
      # Match native UI validation with a pinned compiler and XCTest toolchain.
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - name: Set node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run convert
      - run: brew install xcodegen
      - run: xcodegen generate --spec apps/ios/project.yml
      - run: xcodebuild -version
      - name: Select compatible simulators
        id: simulators
        run: pnpm exec tsx scripts/select-ios-test-devices.ts >> "$GITHUB_OUTPUT"
      - name: Build and test
        id: ios_tests
        env:
          IPHONE: ${{ steps.simulators.outputs.iphone }}
          IPAD: ${{ steps.simulators.outputs.ipad }}
        run: |
          xcrun simctl list runtimes
          xcrun simctl list devices available
          # 连启动也串行；每个字体审计使用独立测试宿主和新启动的模拟器。
          # 两项审计从常规回归中移出后分别执行，保留所有用例、审计类别和失败。
          result=0
          standard_audit=CookUITests/DietaryGoalsUITests/testNativeGoalPickerAccessibilityAndReviewedSummary
          maximum_audit=CookUITests/DietaryGoalsUITests/testLargestTextCanChooseRememberReadAndRoll
          run_once() {
            local device="$1" stage="$2" code=0
            shift 2
            echo "Running $stage on $device"
            if xcrun simctl bootstatus "$device" -b; then
              xcodebuild test -project apps/ios/Cook.xcodeproj -scheme Cook -destination "id=$device" \
                -destination-timeout 180 -parallel-testing-enabled NO \
                "$@" -resultBundlePath "$RUNNER_TEMP/xcresult/$device-$stage.xcresult" \
                CODE_SIGNING_ALLOWED=NO || code=$?
            else
              code=1
            fi
            xcrun simctl shutdown "$device" || result=1
            return "$code"
          }
          run_tests() {
            local device="$1" stage="$2"
            shift 2
            if run_once "$device" "$stage" "$@"; then
              return
            fi
            # Keep the failed bundle. Only these two known audit-infrastructure
            # errors may repeat once in a new host on the same existing device.
            if [[ "$stage" == dietary-standard || "$stage" == dietary-maximum ]] &&
              node scripts/classify-ios-test-retry.mjs "$RUNNER_TEMP/xcresult/$device-$stage.xcresult" "${1-}"; then
              echo "::warning title=Isolated iOS infrastructure retry::$device $stage failed before audit completion; original result bundle retained"
              echo "infrastructure_retries=true" >> "$GITHUB_OUTPUT"
              run_once "$device" "$stage-infrastructure-retry" "$@" || result=1
            else
              result=1
            fi
          }
          for device in "$IPHONE" "$IPAD"; do
            run_tests "$device" regression "-skip-testing:$standard_audit" "-skip-testing:$maximum_audit"
            run_tests "$device" dietary-standard "-only-testing:$standard_audit"
            run_tests "$device" dietary-maximum "-only-testing:$maximum_audit"
          done
          exit "$result"
      # 跑多个设备时 xcodebuild 的日志里只有失败的用例名，没有原因，从结果包里读出来
      - name: Show test failures
        if: failure()
        run: |
          for bundle in "$RUNNER_TEMP"/xcresult/*.xcresult; do
            [ -d "$bundle" ] || continue
            xcrun xcresulttool get test-results summary --path "$bundle" | python3 -c '
          import json, sys
          for failure in json.load(sys.stdin).get("testFailures", []):
              name = failure.get("testName", "")
              text = failure.get("failureText", "")
              print(f"::error title={name}::{text}")
              print(json.dumps(failure, ensure_ascii=False, indent=2))
          '
          done
      # 截图和每一步的操作记录都在结果包里，下载后用 Xcode 打开
      - name: Upload test results
        if: ${{ failure() || steps.ios_tests.outputs.infrastructure_retries == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: ios-xcresult
          path: ${{ runner.temp }}/xcresult/
          if-no-files-found: ignore
          retention-days: 7
