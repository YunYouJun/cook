name: CI

on:
  push:
    branches:
      - main
      - dev

  pull_request:
    branches:
      - main
      - dev

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      docs_only: ${{ steps.changes.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Test change detection
        run: node --test test/ciChanges.test.mjs
      - name: Detect documentation-only changes
        id: changes
        run: node scripts/ci-changes.mjs

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Convert CSV to JSON
        run: pnpm run convert

      - name: Typecheck
        run: pnpm run typecheck

  # Build from a fresh checkout before typecheck can generate packages/cook/dist.
  # This matches the preview providers and catches missing workspace source aliases.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Build documentation
        run: pnpm run docs:build
      - name: Verify product site composition and legacy redirect
        run: |
          node --test test/docsRedirect.test.mjs test/productSiteBuild.test.mjs
          node scripts/compose-product-site.mjs

  test:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        node-version: [24]
        os: [ubuntu-latest]
      fail-fast: false

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: https://registry.npmjs.org/
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run convert
      - run: pnpm run validate
      - run: pnpm run amounts:check
      - name: Check recipe ids against base branch
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 origin ${{ github.base_ref }}
          pnpm run validate --base FETCH_HEAD
      - name: Test release provenance and Support delivery gates
        run: node --test --test-reporter=dot test/webBuildInfo.test.mjs test/productSiteBuild.test.mjs test/supportAgentHttp.test.mjs test/cookGithubChanges.test.mjs test/cookDeliverySync.test.mjs test/supportLedger.test.mjs test/edgeoneRelease.test.mjs test/cookSupportRunner.test.mjs
      - run: pnpm run test

  # iOS 的 CookCore 跑和 Web 共用的用例（ubuntu 镜像自带 Swift）
  swift:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - name: Set node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run convert
      - run: swift --version
      - run: swift test --package-path apps/ios/CookCore
      - run: bash scripts/test-private-recipe-roundtrip.sh
      - run: bash scripts/test-personal-catalog-roundtrip.sh
        env:
          COOK_SWIFT_SCRATCH_PATH: apps/ios/CookCore/.build

  # 云食册 iOS App：XcodeGen 生成工程，在 iPhone 和 iPad 模拟器上编译并跑测试（窄屏和宽屏两种布局）
  ios:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true') }}
    runs-on: macos-26
    env:
      # The image includes Xcode 26.5 and iOS 26.5. Pin the matching toolchain:
      # the default 26.6 intermittently reports only simulator placeholders.
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - name: Set node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run convert
      - run: brew install xcodegen
      - run: xcodegen generate --spec apps/ios/project.yml
      - run: xcodebuild -version
      - name: Select compatible simulators
        id: simulators
        run: pnpm exec tsx scripts/select-ios-test-devices.ts >> "$GITHUB_OUTPUT"
      - name: Build and test
        env:
          IPHONE: ${{ steps.simulators.outputs.iphone }}
          IPAD: ${{ steps.simulators.outputs.ipad }}
        run: |
          xcrun simctl list runtimes
          xcrun simctl list devices available
          # 连启动也串行；关掉第一台再启动第二台，不让两台同时争用 runner。
          # 即使第一台失败也跑第二台，保留两份结果；任一失败都会让检查失败。
          result=0
          for device in "$IPHONE" "$IPAD"; do
            if xcrun simctl bootstatus "$device" -b; then
              xcodebuild test -project apps/ios/Cook.xcodeproj -scheme Cook -destination "id=$device" \
                -destination-timeout 180 -parallel-testing-enabled NO \
                -resultBundlePath "$RUNNER_TEMP/xcresult/$device.xcresult" CODE_SIGNING_ALLOWED=NO || result=1
            else
              result=1
            fi
            xcrun simctl shutdown "$device" || result=1
          done
          exit "$result"
      # 跑多个设备时 xcodebuild 的日志里只有失败的用例名，没有原因，从结果包里读出来
      - name: Show test failures
        if: failure()
        run: |
          for bundle in "$RUNNER_TEMP"/xcresult/*.xcresult; do
            [ -d "$bundle" ] || continue
            xcrun xcresulttool get test-results summary --path "$bundle" | python3 -c '
          import json, sys
          for failure in json.load(sys.stdin).get("testFailures", []):
              name = failure.get("testName", "")
              text = failure.get("failureText", "")
              print(f"::error title={name}::{text}")
              print(json.dumps(failure, ensure_ascii=False, indent=2))
          '
          done
      # 截图和每一步的操作记录都在结果包里，下载后用 Xcode 打开
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-xcresult
          path: ${{ runner.temp }}/xcresult/
          if-no-files-found: ignore
          retention-days: 7
