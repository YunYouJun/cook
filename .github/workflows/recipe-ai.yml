name: Recipe AI

# 维护者给菜谱 issue 打上 ai-fix 标签后，由 Claude 修改 app/data/recipe.csv 并提交分支
# 需要在仓库 Secrets 中配置 ANTHROPIC_API_KEY
on:
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  fix:
    if: github.event.label.name == 'ai-fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: --allowedTools "Bash(pnpm run validate*),Bash(pnpm validate*)"
          prompt: |
            你在维护菜谱数据 app/data/recipe.csv。请处理 issue #${{ github.event.issue.number }}。

            规则见 docs/dev/data.md，要点：
            - 只修改 app/data/recipe.csv。不要删除或调整已有行的顺序（收藏按行号记录），新菜谱追加到末尾。
            - 列为 name,stuff,bv,difficulty,tags,methods,tools，行尾保留逗号；单元格内多个值用顿号「、」分隔。
            - 食材和厨具只能使用 app/data/food.ts 中已有的名称；对不上时改用最接近的已有名称，并在说明里写明。
            - 难度只能是 简单 / 普通 / 困难 或留空。
            - 视频失效时：issue 里给了替代视频就替换 bv；没给就不要编造视频号，在 issue 中说明需要人工找替代视频。
            - 修改后运行 pnpm run validate，必须没有错误。

            完成后在 issue 里用一两句话说明改了哪几行，并附上创建 PR 的链接，PR 描述中写 Closes #${{ github.event.issue.number }}。
            信息不足时不要猜，直接在 issue 里说明缺什么。
