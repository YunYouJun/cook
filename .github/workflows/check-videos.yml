name: Check Videos

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/check-videos.yml
      - scripts/check-video-links.ts
      - scripts/lib/video-check.ts
      - test/videoCheck.test.ts
      - packages/data/recipe.csv
      - packages/cook/src/utils/**
      - package.json
      - pnpm-lock.yaml
  pull_request:
    paths:
      - .github/workflows/check-videos.yml
      - scripts/check-video-links.ts
      - scripts/lib/video-check.ts
      - test/videoCheck.test.ts
      - packages/data/recipe.csv
      - packages/cook/src/utils/**
      - package.json
      - pnpm-lock.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate local recipe data
        run: pnpm run validate
      - name: Test video checks with mocked responses
        run: pnpm exec vitest run test/videoCheck.test.ts packages/cook/src/utils/bilibili.test.ts
      - name: Generate offline coverage report
        run: |
          pnpm run check:videos --out artifacts/video-report.md
          cat artifacts/video-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: video-report-offline
          path: artifacts/video-report.md
